name: evaluate

on:
  workflow_dispatch:
    inputs:
      samples:
        description: Samples per case
        default: "3"
      model:
        description: Model to evaluate with
        default: claude-sonnet-5-5
      tests_ref:
        description: Ref of tw-cia/kiln-evaluations-tests to run
        default: main
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          SAMPLES: ${{ inputs.samples || '3' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          cases = sorted(p.name for p in pathlib.Path("cases").iterdir() if (p / "prompt.md").exists())
          include = [{"case": c, "sample": s} for c in cases for s in range(1, int(os.environ["SAMPLES"]) + 1)]
          print("matrix=" + json.dumps({"include": include}))
          PY

  generate:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tooling
        run: |
          npm install -g @anthropic-ai/claude-code
          curl -fsSL https://kcl-lang.io/script/install-cli.sh | bash
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/main/install.sh" | sh
          sudo mv crossplane /usr/local/bin/
          uv sync
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          kiln-evaluations run cases/${{ matrix.case }}
          --sample ${{ matrix.sample }} --model "${{ inputs.model || 'claude-sonnet-5-5' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-${{ matrix.case }}-${{ matrix.sample }}
          path: outputs/
          include-hidden-files: true
          retention-days: 30

  test:
    needs: generate
    if: always() && needs.generate.result != 'skipped'
    runs-on: ubuntu-latest
    # No ANTHROPIC_API_KEY here: generated output is untrusted.
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tw-cia/kiln-evaluations-tests
          ref: ${{ inputs.tests_ref || 'main' }}
          token: ${{ secrets.TESTS_REPO_TOKEN }}
          path: tests
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: output-*
          path: outputs
          merge-multiple: true
      - name: Run tests
        working-directory: tests
        run: uv run pytest --outputs-dir ../outputs --junitxml ../results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results.xml
