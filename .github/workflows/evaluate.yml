name: evaluate

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: shared
          path: shared/agent/
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: case-hello-world
          path: cases/hello-world/agent/
          include-hidden-files: true
          retention-days: 1

  agent:
    needs: setup
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # shared first, then the case on top, so the case's files win
      - uses: actions/download-artifact@v4
        with:
          name: shared
          path: cases/hello-world
      - uses: actions/download-artifact@v4
        with:
          name: case-hello-world
          path: cases/hello-world
      - run: npm install -g opencode-ai@1.19.6
      - name: Check the endpoint
        env:
          TW_OPENAI_API_URL: ${{ secrets.TW_OPENAI_API_URL }}
          TW_OPENAI_API_KEY: ${{ secrets.TW_OPENAI_API_KEY }}
        run: |
          curl -sS -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $TW_OPENAI_API_KEY" "$TW_OPENAI_API_URL/models" | head -c 2000
      - name: Run opencode
        working-directory: cases/hello-world
        env:
          TW_OPENAI_API_URL: ${{ secrets.TW_OPENAI_API_URL }}
          TW_OPENAI_API_KEY: ${{ secrets.TW_OPENAI_API_KEY }}
        run: opencode run --print-logs --log-level DEBUG "$(cat prompt.md)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-hello-world
          path: cases/hello-world/
          include-hidden-files: true
          retention-days: 1

  test:
    needs: agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # the checks expect outputs/<case>/<sample>/project
      - uses: actions/download-artifact@v4
        with:
          name: workspace-hello-world
          path: outputs/hello-world/1/project
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project --python 3.13 --with pytest pytest cases/hello-world --outputs-dir outputs

  aws-readonly:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160071257600:role/cia-test-readonly
          aws-region: us-east-1
      - run: aws sts get-caller-identity

  aws-github-actions:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160071257600:role/cia-test-github-actions
          aws-region: us-east-1
      - run: aws sts get-caller-identity
