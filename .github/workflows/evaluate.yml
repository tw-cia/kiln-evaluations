name: evaluate

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so runs stay comparable. Bump deliberately.
  KCL_VERSION: v0.13.3
  CROSSPLANE_VERSION: v2.4.3
  KILN_COMMIT: 22bb78aaf4aa6c3960ff0e94a8a4263449413ba3   # keep equal to the kiln commit in uv.lock

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: shared
          path: shared/agent/
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: case-storage-bucket
          path: cases/storage-bucket/agent/
          include-hidden-files: true
          retention-days: 1

  agent:
    needs: setup
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # shared first, then the case on top, so the case's files win
      - uses: actions/download-artifact@v4
        with:
          name: shared
          path: cases/storage-bucket
      - uses: actions/download-artifact@v4
        with:
          name: case-storage-bucket
          path: cases/storage-bucket
      - uses: astral-sh/setup-uv@v5
      - name: Install tooling
        run: |
          mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/kcl-lang/cli/releases/download/${KCL_VERSION}/kcl-${KCL_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kcl
          curl -fsSL -o "$HOME/.local/bin/crossplane" "https://releases.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane"
          chmod +x "$HOME/.local/bin/crossplane"
          uv tool install "git+https://github.com/leprechaun/kiln@${KILN_COMMIT}#subdirectory=tooling"
      - run: npm install -g opencode-ai@1.19.6
      - name: Check the endpoint
        env:
          TW_OPENAI_API_URL: ${{ secrets.TW_OPENAI_API_URL }}
          TW_OPENAI_API_KEY: ${{ secrets.TW_OPENAI_API_KEY }}
        run: |
          curl -sS -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $TW_OPENAI_API_KEY" "$TW_OPENAI_API_URL/models" | head -c 2000
      - name: Run opencode
        working-directory: cases/storage-bucket
        env:
          # the runner is disposable and holds no credentials beyond the LLM key, so nothing needs approving
          OPENCODE_PERMISSION: '{"*": "allow"}'
          TW_OPENAI_API_URL: ${{ secrets.TW_OPENAI_API_URL }}
          TW_OPENAI_API_KEY: ${{ secrets.TW_OPENAI_API_KEY }}
        run: opencode run --print-logs --log-level DEBUG "$(cat prompt.md)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-storage-bucket
          path: cases/storage-bucket/
          include-hidden-files: true
          retention-days: 1

  test:
    needs: agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # the checks expect outputs/<case>/<sample>/project
      - uses: actions/download-artifact@v4
        with:
          name: workspace-storage-bucket
          path: outputs/storage-bucket/1/project
      - uses: astral-sh/setup-uv@v5
      - name: Install tooling
        run: |
          mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/kcl-lang/cli/releases/download/${KCL_VERSION}/kcl-${KCL_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kcl
          curl -fsSL -o "$HOME/.local/bin/crossplane" "https://releases.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane"
          chmod +x "$HOME/.local/bin/crossplane"
          uv tool install "git+https://github.com/leprechaun/kiln@${KILN_COMMIT}#subdirectory=tooling"
      - run: uv sync --frozen
      - run: uv run pytest cases/storage-bucket --outputs-dir outputs

  aws-readonly:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160071257600:role/cia-test-readonly
          aws-region: us-east-1
      - run: aws sts get-caller-identity

  aws-github-actions:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160071257600:role/cia-test-github-actions
          aws-region: us-east-1
      - run: aws sts get-caller-identity
