name: evaluate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # (steps in between get added here)
      - uses: actions/upload-artifact@v4
        with:
          name: prompt
          path: cases/storage-bucket/prompt.md
          retention-days: 1

  generate:
    needs: checkout
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prompt
          path: ${{ runner.temp }}/prompt
      - id: prompt
        run: |
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "text<<$delimiter"; cat "$RUNNER_TEMP/prompt/prompt.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - name: Run Claude Code
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002   # v1
        with:
          prompt: ${{ steps.prompt.outputs.text }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # the job's own zero-permission token, so the action never mints a GitHub App token (which could read the repo)
          github_token: ${{ github.token }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --max-budget-usd 0.50
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
      # (steps in between get added here)
