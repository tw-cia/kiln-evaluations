name: evaluate

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One artifact per case holding ONLY what its agent may see: the shared config with the case's agent/ laid on top.
  setup:
    name: setup (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        case: [storage-bucket, static-website]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lay the case on top of the shared config
        run: |
          mkdir -p "$RUNNER_TEMP/agent"
          cp -a shared/agent/. "$RUNNER_TEMP/agent/"
          cp -a "cases/${{ matrix.case }}/agent/." "$RUNNER_TEMP/agent/"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.case }}
          path: ${{ runner.temp }}/agent/
          include-hidden-files: true
          retention-days: 1

  # model x case: every pair is its own independent agent -> test chain (see case.yml)
  evaluate:
    name: evaluate (${{ matrix.case }}, ${{ matrix.model.name }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        case: [storage-bucket, static-website]
        model:
          # `ref` is how opencode is told to use it: provider "agentworks" plus the id the endpoint serves.
          # Add a model by adding a line; to switch one off, comment it out.
          - { name: qwen3-8-27b, ref: agentworks/agentworks/qwen3-8-27b, live: true }
          - { name: nemotron-3-5-lightning-30b-a3b, ref: agentworks/agentworks/nemotron-3-5-lightning-30b-a3b, live: true }
          # - { name: claude-haiku-5-5, ref: agentworks/claude-haiku-5-5 }
          # - { name: deepseek-v4-flash, ref: agentworks/deepseek-ai/Deepseek-V4-Flash }
          # - { name: glm-5-3, ref: agentworks/zai-org/GLM-5.3 }
    uses: ./.github/workflows/case.yml
    with:
      case: ${{ matrix.case }}
      model: ${{ matrix.model.name }}
      model-ref: ${{ matrix.model.ref }}
      live: ${{ matrix.model.live || false }}
    secrets: inherit
    # the most any job inside may ask for: only apply and verify use id-token, and the agent job narrows itself to none
    permissions:
      contents: read
      id-token: write

  aws-readonly:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160071257600:role/cia-test-readonly
          aws-region: us-east-1
      - run: aws sts get-caller-identity

  aws-github-actions:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160071257600:role/cia-test-github-actions
          aws-region: us-east-1
      - run: aws sts get-caller-identity
