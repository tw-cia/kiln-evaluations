name: evaluate

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so runs stay comparable. Bump deliberately.
  KCL_VERSION: v0.13.3
  CROSSPLANE_VERSION: v2.5.0
  KILN_COMMIT: 22bb78aaf4aa6c3960ff0e94a8a4263449413ba3   # keep equal to the kiln commit in uv.lock

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: shared
          path: shared/agent/
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: case-storage-bucket
          path: cases/storage-bucket/agent/
          include-hidden-files: true
          retention-days: 1

  agent-qwen3-8-27b:
    name: agent (qwen3-8-27b)
    needs: setup
    runs-on: ubuntu-latest
    permissions: {}
    env:
      MODEL_SLUG: qwen3-8-27b
    steps:
      # shared first, then the case on top, so the case's files win
      - uses: actions/download-artifact@v4
        with:
          name: shared
          path: cases/storage-bucket
      - uses: actions/download-artifact@v4
        with:
          name: case-storage-bucket
          path: cases/storage-bucket
      - uses: astral-sh/setup-uv@v5
      - name: Install tooling
        run: |
          mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/kcl-lang/cli/releases/download/${KCL_VERSION}/kcl-${KCL_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kcl
          curl -fsSL -o "$HOME/.local/bin/crossplane" "https://cli.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane"
          chmod +x "$HOME/.local/bin/crossplane"
          uv tool install "git+https://github.com/leprechaun/kiln@${KILN_COMMIT}#subdirectory=tooling"
      - run: npm install -g opencode-ai@1.19.6
      - name: Start from a plain kiln init project
        working-directory: cases/storage-bucket
        run: kiln init . --group "storage-bucket.${MODEL_SLUG}.platform.demotw.com"
      - name: Run opencode
        working-directory: cases/storage-bucket
        env:
          # the runner is disposable and holds no credentials beyond the LLM key, so nothing needs approving
          OPENCODE_PERMISSION: '{"*": "allow"}'
          TW_OPENAI_API_URL: ${{ secrets.TW_OPENAI_API_URL }}
          TW_OPENAI_API_KEY: ${{ secrets.TW_OPENAI_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/session"
          opencode run --model "agentworks/agentworks/${MODEL_SLUG}" --format json "$(cat prompt.md)" | tee "$RUNNER_TEMP/session/events.jsonl"
      # kept outside the workspace so the checks never see them
      - name: Export the session
        if: always()
        working-directory: cases/storage-bucket
        run: |
          mkdir -p "$RUNNER_TEMP/session"
          id=$(opencode session list -n 1 --format json | jq -r '.[0].id')
          opencode export "$id" > "$RUNNER_TEMP/session/session.json"
          opencode stats --models > "$RUNNER_TEMP/session/stats.txt"
          { echo '### opencode token usage'; echo '```'; cat "$RUNNER_TEMP/session/stats.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-storage-bucket-qwen3-8-27b
          path: ${{ runner.temp }}/session/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-storage-bucket-qwen3-8-27b
          path: cases/storage-bucket/
          include-hidden-files: true
          retention-days: 1

  test-qwen3-8-27b:
    name: test (qwen3-8-27b)
    needs: agent-qwen3-8-27b
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # the checks expect outputs/<case>/<sample>/project
      - uses: actions/download-artifact@v4
        with:
          name: workspace-storage-bucket-qwen3-8-27b
          path: outputs/storage-bucket/1/project
      - uses: astral-sh/setup-uv@v5
      - name: Install tooling
        run: |
          mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/kcl-lang/cli/releases/download/${KCL_VERSION}/kcl-${KCL_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kcl
          curl -fsSL -o "$HOME/.local/bin/crossplane" "https://cli.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane"
          chmod +x "$HOME/.local/bin/crossplane"
          uv tool install "git+https://github.com/leprechaun/kiln@${KILN_COMMIT}#subdirectory=tooling"
      - name: kcl test
        working-directory: outputs/storage-bucket/1/project/kcl-scripts
        run: kcl test .
      - name: kiln render
        working-directory: outputs/storage-bucket/1/project
        run: kiln render-all
      - run: uv sync --frozen
      - run: uv run pytest cases/storage-bucket --outputs-dir outputs

  apply-qwen3-8-27b:
    name: apply (qwen3-8-27b)
    needs: test-qwen3-8-27b
    # agent-written manifests go to the shared cluster: main only, and only after a reviewer approves the `aws` environment
    if: github.ref == 'refs/heads/main'
    environment: aws
    runs-on: ubuntu-latest
    # live runs share one cluster, so they queue
    concurrency:
      group: live-eks
      cancel-in-progress: false
    permissions:
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      EKS_CLUSTER: cia-test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace-storage-bucket-qwen3-8-27b
          path: project
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160071257600:role/cia-test-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up EKS credentials
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Apply the XRD and Composition
        working-directory: project/manifests/crossplane-compositions/storagebucket
        run: |
          kubectl apply -f xrd.yaml -f composition.yaml
          kubectl wait --for=condition=Established --timeout=120s -f xrd.yaml
      - name: Apply the sample XR
        working-directory: project
        run: |
          xr=$(find render-fixtures -ipath '*/storagebucket/xr.yaml' | head -n 1)
          test -n "$xr" || { echo "no sample XR found under render-fixtures/"; exit 1; }
          ns="eval-${{ github.run_id }}-1"
          kubectl create namespace "$ns"
          # the agent's sample XR may name its own namespace (e.g. default); the run's namespace wins
          ns="$ns" yq '.metadata.namespace = strenv(ns)' "$xr" | kubectl apply -f -

