name: evaluate

# 1 prompt -> 2 generate (agent; Claude creds only) -> 3 static (hidden checks; no creds).
# Later jobs, in order: generate the XR (Claude), static checks on it, a human gate, apply (AWS creds, no Claude), teardown.
# Rule (ADR 0003): no job holds more than one kind of credential, and jobs that run agent code hold none.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate
        default: claude-sonnet-5-5

permissions:
  contents: read

env:
  CASE: storage-bucket
  # Pinned so runs stay comparable. Bump deliberately (and keep in step with claude-sandbox.yml).
  KCL_VERSION: v0.13.3
  CROSSPLANE_VERSION: v2.4.3

jobs:
  # An artifact holding ONLY the case's prompt: the agent never sees anything else.
  prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cases/${{ env.CASE }}/prompt.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: prompt
          path: cases/${{ env.CASE }}/prompt.md
          retention-days: 1

  # The agent runs in the shared Claude sandbox (see claude-sandbox.yml): no checkout, no token, no AWS.
  generate:
    needs: prompt
    permissions: {}
    uses: ./.github/workflows/claude-sandbox.yml
    with:
      prompt-artifact: prompt
      output-artifact: output
      output-path: storage-bucket/1
      group: s${{ github.run_id }}-1.eval.example.com
      model: ${{ inputs.model || 'claude-sonnet-5-5' }}

  # Full checkout, but no API key: generated output is untrusted and the checks must stay hidden from the agent.
  static:
    needs: generate
    if: always() && needs.generate.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install tooling
        run: |
          mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/kcl-lang/cli/releases/download/${KCL_VERSION}/kcl-${KCL_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kcl
          curl -fsSL -o "$HOME/.local/bin/crossplane" "https://releases.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane"
          chmod +x "$HOME/.local/bin/crossplane"
      - uses: actions/download-artifact@v4
        with:
          name: output
          path: outputs
      - run: uv sync --frozen
      - name: Static checks
        run: uv run pytest cases --outputs-dir outputs --junitxml results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-results
          path: results.xml
          retention-days: 90
