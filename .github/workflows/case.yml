# One model on one case: the agent works, then the hidden checks judge what it produced.
# Called once per model x case by evaluate.yml, so every pair is its own independent chain of jobs.
name: case

on:
  workflow_call:
    inputs:
      case:
        description: Case name, a directory under cases/
        type: string
        required: true
      model:
        description: Short DNS-safe name of the model, used in artifact names and the kiln API group
        type: string
        required: true
      model-ref:
        description: The model as opencode is told to use it (provider/model-id)
        type: string
        required: true
      live:
        description: Also apply the output to the shared EKS cluster and verify the AWS resources (storage-bucket only)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Pinned so runs stay comparable. Bump deliberately.
  KCL_VERSION: v0.13.3
  CROSSPLANE_VERSION: v2.5.0
  KILN_COMMIT: 22bb78aaf4aa6c3960ff0e94a8a4263449413ba3   # keep equal to the kiln commit in uv.lock
  OPENCODE_VERSION: 1.19.6

jobs:
  agent:
    name: agent (${{ inputs.case }}, ${{ inputs.model }})
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CASE: ${{ inputs.case }}
      MODEL_SLUG: ${{ inputs.model }}
      MODEL_REF: ${{ inputs.model-ref }}
    # facts for the report job at the end: when it ran, what it cost, how much work the agent did
    outputs:
      started: ${{ steps.t0.outputs.started }}
      ended: ${{ steps.facts.outputs.ended }}
      turns: ${{ steps.facts.outputs.turns }}
      tool_calls: ${{ steps.facts.outputs.tool_calls }}
      tokens_input: ${{ steps.facts.outputs.tokens_input }}
      tokens_output: ${{ steps.facts.outputs.tokens_output }}
      tokens_reasoning: ${{ steps.facts.outputs.tokens_reasoning }}
      tokens_cache_read: ${{ steps.facts.outputs.tokens_cache_read }}
      tokens_cache_write: ${{ steps.facts.outputs.tokens_cache_write }}
      cost: ${{ steps.facts.outputs.cost }}
      prompt_sha256: ${{ steps.fp.outputs.prompt_sha256 }}
      config_sha256: ${{ steps.fp.outputs.config_sha256 }}
    steps:
      - id: t0
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      # setup already laid the case on top of the shared config
      - uses: actions/download-artifact@v4
        with:
          name: agent-${{ inputs.case }}
          path: work
      - uses: astral-sh/setup-uv@v5
      - name: Install tooling
        run: |
          mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/kcl-lang/cli/releases/download/${KCL_VERSION}/kcl-${KCL_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kcl
          curl -fsSL -o "$HOME/.local/bin/crossplane" "https://cli.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane"
          chmod +x "$HOME/.local/bin/crossplane"
          uv tool install "git+https://github.com/leprechaun/kiln@${KILN_COMMIT}#subdirectory=tooling"
      - run: npm install -g "opencode-ai@${OPENCODE_VERSION}"
      - name: Start from a plain kiln init project
        working-directory: work
        run: kiln init . --group "${CASE}.${MODEL_SLUG}.platform.demotw.com"
      # what the prompt and the config were, as the agent will see them (after kiln init); read by the telemetry below
      - name: Fingerprint the inputs
        id: fp
        working-directory: work
        run: |
          prompt=$(sha256sum prompt.md | cut -d' ' -f1); config=$(sha256sum opencode.json | cut -d' ' -f1)
          { echo "PROMPT_SHA256=$prompt"; echo "CONFIG_SHA256=$config"; } >> "$GITHUB_ENV"
          { echo "prompt_sha256=$prompt"; echo "config_sha256=$config"; } >> "$GITHUB_OUTPUT"
      - name: Run opencode
        working-directory: work
        env:
          # the runner is disposable and holds no credentials beyond the LLM key, so nothing needs approving
          OPENCODE_PERMISSION: '{"*": "allow"}'
          TW_OPENAI_API_URL: ${{ secrets.TW_OPENAI_API_URL }}
          TW_OPENAI_API_KEY: ${{ secrets.TW_OPENAI_API_KEY }}
          # traces go to your OTLP collector; with no endpoint secret set, nothing is exported
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_SERVICE_NAME: opencode
          # spans are sent in batches of this many (the SDK default is 512)
          OTEL_BSP_MAX_EXPORT_BATCH_SIZE: '50'
          OTEL_RESOURCE_ATTRIBUTES: case=${{ inputs.case }},model=${{ inputs.model }},model.ref=${{ inputs.model-ref }},github.repository=${{ github.repository }},github.event_name=${{ github.event_name }},github.ref_name=${{ github.ref_name }},github.sha=${{ github.sha }},github.run_id=${{ github.run_id }},github.run_number=${{ github.run_number }},github.run_attempt=${{ github.run_attempt }},run.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }},opencode.version=${{ env.OPENCODE_VERSION }},kcl.version=${{ env.KCL_VERSION }},crossplane.version=${{ env.CROSSPLANE_VERSION }},kiln.commit=${{ env.KILN_COMMIT }},prompt.sha256=${{ env.PROMPT_SHA256 }},config.sha256=${{ env.CONFIG_SHA256 }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/session"
          opencode run --model "$MODEL_REF" --format json "$(cat prompt.md)" | tee "$RUNNER_TEMP/session/events.jsonl"
      # kept outside the workspace so the checks never see them
      - name: Export the session
        if: always()
        working-directory: work
        run: |
          mkdir -p "$RUNNER_TEMP/session"
          id=$(opencode session list -n 1 --format json | jq -r '.[0].id')
          opencode export "$id" > "$RUNNER_TEMP/session/session.json"
          opencode stats --models > "$RUNNER_TEMP/session/stats.txt"
          { echo '### opencode token usage'; echo '```'; cat "$RUNNER_TEMP/session/stats.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Summarise the session
        id: facts
        if: always()
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, time
          print(f"ended={int(time.time())}")
          try:
              session = json.load(open(os.environ["RUNNER_TEMP"] + "/session/session.json"))
          except Exception:
              raise SystemExit  # no session to summarise
          tokens = session["info"].get("tokens") or {}
          cache = tokens.get("cache") or {}
          messages = session.get("messages") or []
          print(f"turns={sum(1 for m in messages if m['info'].get('role') == 'assistant')}")
          print(f"tool_calls={sum(1 for m in messages for part in m.get('parts', []) if part.get('type') == 'tool')}")
          print(f"tokens_input={tokens.get('input', 0)}")
          print(f"tokens_output={tokens.get('output', 0)}")
          print(f"tokens_reasoning={tokens.get('reasoning', 0)}")
          print(f"tokens_cache_read={cache.get('read', 0)}")
          print(f"tokens_cache_write={cache.get('write', 0)}")
          print(f"cost={session['info'].get('cost', 0)}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-${{ inputs.case }}-${{ inputs.model }}
          path: ${{ runner.temp }}/session/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-${{ inputs.case }}-${{ inputs.model }}
          path: work/
          include-hidden-files: true
          retention-days: 1

  test:
    name: test (${{ inputs.case }}, ${{ inputs.model }})
    needs: agent
    runs-on: ubuntu-latest
    env:
      CASE: ${{ inputs.case }}
    outputs:
      started: ${{ steps.t0.outputs.started }}
      ended: ${{ steps.facts.outputs.ended }}
      tests_passed: ${{ steps.facts.outputs.tests_passed }}
      tests_failed: ${{ steps.facts.outputs.tests_failed }}
      kcl_test: ${{ steps.kcl.outcome }}
      kiln_render: ${{ steps.render.outcome }}
    steps:
      - id: t0
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # the checks expect outputs/<case>/<sample>/project
      - uses: actions/download-artifact@v4
        with:
          name: workspace-${{ inputs.case }}-${{ inputs.model }}
          path: outputs/${{ inputs.case }}/1/project
      - uses: astral-sh/setup-uv@v5
      - name: Install tooling
        run: |
          mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/kcl-lang/cli/releases/download/${KCL_VERSION}/kcl-${KCL_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kcl
          curl -fsSL -o "$HOME/.local/bin/crossplane" "https://cli.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane"
          chmod +x "$HOME/.local/bin/crossplane"
          uv tool install "git+https://github.com/leprechaun/kiln@${KILN_COMMIT}#subdirectory=tooling"
      - name: kcl test
        id: kcl
        working-directory: outputs/${{ inputs.case }}/1/project/kcl-scripts
        run: kcl test .
      - name: kiln render
        id: render
        working-directory: outputs/${{ inputs.case }}/1/project
        run: kiln render-all
      - run: uv sync --frozen
      - run: uv run pytest -vv "cases/$CASE" --outputs-dir outputs --junitxml "$RUNNER_TEMP/results.xml"
      - name: Count the checks
        id: facts
        if: always()
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import os, time, xml.etree.ElementTree as ET
          print(f"ended={int(time.time())}")
          try:
              suite = ET.parse(os.environ["RUNNER_TEMP"] + "/results.xml").getroot()
              suite = suite if suite.tag == "testsuite" else suite[0]
          except Exception:
              raise SystemExit  # pytest never got as far as writing results
          total, bad = int(suite.get("tests", 0)), int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          print(f"tests_passed={total - bad - int(suite.get('skipped', 0))}")
          print(f"tests_failed={bad}")
          PY

  apply:
    name: apply (${{ inputs.case }}, ${{ inputs.model }})
    needs: test
    # agent-written manifests go to the shared cluster: opted in, storage-bucket only, main only,
    # and only after a reviewer approves the `aws` environment
    if: inputs.live && inputs.case == 'storage-bucket' && github.ref == 'refs/heads/main'
    environment: aws
    runs-on: ubuntu-latest
    # no concurrency group: a group keeps only one waiting job and cancels the rest, which would drop applies as soon
    # as three models are live. Each model has its own API group, XRD, Composition and namespace, so they cannot clash.
    permissions:
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      EKS_CLUSTER: cia-test
    outputs:
      started: ${{ steps.t0.outputs.started }}
      ended: ${{ steps.t1.outputs.ended }}
    steps:
      - id: t0
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: workspace-${{ inputs.case }}-${{ inputs.model }}
          path: project
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160071257600:role/cia-test-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up EKS credentials
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Apply the XRD and Composition
        working-directory: project/manifests/crossplane-compositions/storagebucket
        run: |
          kubectl apply -f xrd.yaml -f composition.yaml
          kubectl wait --for=condition=Established --timeout=120s -f xrd.yaml
      - name: Apply the sample XR
        working-directory: project
        run: |
          xr=$(find render-fixtures -ipath '*/storagebucket/xr.yaml' | head -n 1)
          test -n "$xr" || { echo "no sample XR found under render-fixtures/"; exit 1; }
          ns="eval-${{ github.run_id }}-${{ inputs.model }}"
          kubectl create namespace "$ns"
          # the agent's sample XR may name its own namespace (e.g. default); the run's namespace wins
          ns="$ns" yq '.metadata.namespace = strenv(ns)' "$xr" | kubectl apply -f -
          # for the steps below
          {
            echo "NS=$ns"
            echo "XR_NAME=$(yq '.metadata.name' "$xr")"
            echo "XR_TYPE=$(yq '.kind' "$xr").$(yq '.apiVersion' "$xr" | cut -d/ -f1)"
          } >> "$GITHUB_ENV"
      - name: Wait for the XR to be ready
        run: kubectl wait --for=condition=Ready --timeout=10m -n "$NS" "$XR_TYPE/$XR_NAME"
      # what Crossplane says it created, read from the cluster itself: the verify job works from this
      - name: Record the composed resources
        if: always() && env.XR_NAME != ''
        run: |
          mkdir -p "$RUNNER_TEMP/live"; cd "$RUNNER_TEMP/live"
          kubectl get "$XR_TYPE" "$XR_NAME" -n "$NS" -o json > xr.json
          : > refs.jsonl
          jq -r '(.spec.crossplane.resourceRefs // .spec.resourceRefs // [])[] | [.apiVersion, .kind, .name] | @tsv' xr.json |
            while IFS=$'\t' read -r api kind name; do
              kubectl get "${kind}.${api%%/*}" "$name" -n "$NS" -o json >> refs.jsonl
            done
          jq -s --slurpfile xr xr.json '{xr: $xr[0], resources: .}' refs.jsonl > resources.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-resources-${{ inputs.case }}-${{ inputs.model }}
          path: ${{ runner.temp }}/live/resources.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Explain a failure
        if: failure() && env.XR_NAME != ''
        run: |
          kubectl describe "$XR_TYPE" "$XR_NAME" -n "$NS" || true
          kubectl get managed -n "$NS" || true
      - id: t1
        if: always()
        run: echo "ended=$(date +%s)" >> "$GITHUB_OUTPUT"

  verify:
    name: verify (${{ inputs.case }}, ${{ inputs.model }})
    needs: apply
    runs-on: ubuntu-latest
    # read-only AWS role, and no cluster access: it only reads what the apply job recorded
    permissions:
      id-token: write
    outputs:
      started: ${{ steps.t0.outputs.started }}
      ended: ${{ steps.t1.outputs.ended }}
    steps:
      - id: t0
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: live-resources-${{ inputs.case }}-${{ inputs.model }}
          path: live
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160071257600:role/cia-test-readonly
          aws-region: ap-southeast-1
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project --python 3.13 --with pytest pytest -vv cases/storage-bucket/tests/test_live.py
        env:
          LIVE_RESOURCES: ${{ github.workspace }}/live/resources.json
      - id: t1
        if: always()
        run: echo "ended=$(date +%s)" >> "$GITHUB_OUTPUT"

  cleanup:
    name: cleanup (${{ inputs.case }}, ${{ inputs.model }})
    needs: [apply, verify]
    # runs whether apply or verify passed, failed or were cancelled, but not when live was never in play
    if: always() && needs.apply.result != 'skipped'
    # same trust as apply: the cluster role is only assumable from the `aws` environment
    environment: aws
    runs-on: ubuntu-latest
    # no concurrency group on purpose: a group keeps only one waiting job and would cancel another model's apply.
    # Everything here is scoped to this model's own namespace, XRD and Composition.
    permissions:
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      EKS_CLUSTER: cia-test
      NS: eval-${{ github.run_id }}-${{ inputs.model }}
    outputs:
      started: ${{ steps.t0.outputs.started }}
      ended: ${{ steps.t1.outputs.ended }}
    steps:
      - id: t0
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      # the manifests the apply job applied: delete exactly those
      - uses: actions/download-artifact@v4
        with:
          name: workspace-${{ inputs.case }}-${{ inputs.model }}
          path: project
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::160071257600:role/cia-test-github-actions
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: Delete the XR and wait for AWS to be cleaned up
        working-directory: project
        run: |
          xr=$(find render-fixtures -ipath '*/storagebucket/xr.yaml' | head -n 1)
          # the XR first, so Crossplane removes the composed AWS resources while the Composition still exists
          [ -z "$xr" ] || ns="$NS" yq '.metadata.namespace = strenv(ns)' "$xr" | kubectl delete -f - --ignore-not-found --wait --timeout=15m
          # deleting the XR returns before its buckets are gone, so wait for the managed resources too
          for i in $(seq 1 60); do
            left=$(kubectl get managed -n "$NS" --no-headers 2>/dev/null | wc -l)
            [ "$left" -eq 0 ] && exit 0
            echo "$left managed resource(s) still deleting"; sleep 15
          done
          echo "managed resources left in $NS after 15 minutes: clean up by hand"; kubectl get managed -n "$NS"; exit 1
      - name: Delete the namespace, Composition and XRD
        if: always()
        working-directory: project/manifests/crossplane-compositions/storagebucket
        run: |
          kubectl delete namespace "$NS" --ignore-not-found --wait --timeout=5m
          kubectl delete -f composition.yaml -f xrd.yaml --ignore-not-found --wait --timeout=5m
      - id: t1
        if: always()
        run: echo "ended=$(date +%s)" >> "$GITHUB_OUTPUT"

  # The one place that sends the pipeline's own telemetry: a span per job and a run.summary, built from what the jobs
  # recorded. It runs no agent code and reads no agent files; the values are only ever span attributes.
  report:
    name: report (${{ inputs.case }}, ${{ inputs.model }})
    needs: [agent, test, apply, verify, cleanup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - run: python3 scripts/emit_spans.py
        env:
          NEEDS: ${{ toJSON(needs) }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_RESOURCE_ATTRIBUTES: case=${{ inputs.case }},model=${{ inputs.model }},model.ref=${{ inputs.model-ref }},github.repository=${{ github.repository }},github.event_name=${{ github.event_name }},github.ref_name=${{ github.ref_name }},github.sha=${{ github.sha }},github.run_id=${{ github.run_id }},github.run_number=${{ github.run_number }},github.run_attempt=${{ github.run_attempt }},run.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }},opencode.version=${{ env.OPENCODE_VERSION }},kcl.version=${{ env.KCL_VERSION }},crossplane.version=${{ env.CROSSPLANE_VERSION }},kiln.commit=${{ env.KILN_COMMIT }}
