name: claude-sandbox

# The only place the Claude key is used (ADR 0003). Callers pass inputs; they cannot change what runs here:
# an empty job with no checkout, no token and no AWS, whose key comes from the `claude` environment.
on:
  workflow_call:
    inputs:
      prompt-artifact:
        description: Artifact holding prompt.md
        type: string
        required: true
      output-artifact:
        description: Name of the artifact to upload
        type: string
        required: true
      output-path:
        description: Where the project lands inside the output artifact, e.g. storage-bucket/1
        type: string
        required: true
      group:
        description: API group for the fresh kiln project
        type: string
        required: true
      model:
        type: string
        required: true
      max-turns:
        type: number
        default: 40
      max-budget-usd:
        type: string
        default: "0.50"

env:
  # Pinned so runs stay comparable. Bump deliberately (and keep in step with evaluate.yml).
  KCL_VERSION: v0.13.3
  CROSSPLANE_VERSION: v2.4.3
  KILN_COMMIT: 22bb78aaf4aa6c3960ff0e94a8a4263449413ba3   # keep equal to the kiln commit in uv.lock

jobs:
  sandbox:
    runs-on: ubuntu-latest
    environment: claude   # holds ANTHROPIC_API_KEY, so no other job can see it
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.prompt-artifact }}
          path: ${{ runner.temp }}/prompt
      - uses: astral-sh/setup-uv@v6
      - name: Install tooling
        run: |
          mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/kcl-lang/cli/releases/download/${KCL_VERSION}/kcl-${KCL_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kcl
          curl -fsSL -o "$HOME/.local/bin/crossplane" "https://releases.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane"
          chmod +x "$HOME/.local/bin/crossplane"
          uv tool install "git+https://github.com/leprechaun/kiln@${KILN_COMMIT}#subdirectory=tooling"
      - name: Start from a plain kiln init project
        env:
          GROUP: ${{ inputs.group }}
        run: kiln init "$GITHUB_WORKSPACE" --group "$GROUP"
      - id: prompt
        run: |
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "text<<$delimiter"; cat "$RUNNER_TEMP/prompt/prompt.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - id: claude
        continue-on-error: true   # a failed or exhausted sample is still an Output worth keeping
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002   # v1
        with:
          prompt: ${{ steps.prompt.outputs.text }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # the job's own zero-permission token, so the action never mints a GitHub App token (which could read the repo)
          github_token: ${{ github.token }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --max-budget-usd ${{ inputs.max-budget-usd }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
      - name: Collect the Output
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          OUTPUT_PATH: ${{ inputs.output-path }}
        run: |
          out="$RUNNER_TEMP/outputs/$OUTPUT_PATH"
          mkdir -p "$out"
          cp -a "$GITHUB_WORKSPACE" "$out/project"
          [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ] && cp "$EXECUTION_FILE" "$out/execution.json"
          # the agent can read its own environment: never upload the key
          { grep -rlIF -- "$ANTHROPIC_API_KEY" "$out" || true; } | xargs -r sed -i "s|$ANTHROPIC_API_KEY|[REDACTED]|g"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.output-artifact }}
          path: ${{ runner.temp }}/outputs
          include-hidden-files: true
          retention-days: 90
