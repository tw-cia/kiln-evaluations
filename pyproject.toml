[project]
name = "kiln-evaluations"
version = "0.1.0"
description = "Evaluates how well an LLM agent can use kiln"
requires-python = ">=3.15"
dependencies = [
    "kiln",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml",
]

[tool.uv]
package = false

[tool.uv.sources]
kiln = { git = "https://github.com/leprechaun/kiln", subdirectory = "tooling" }

[tool.pytest.ini_options]
testpaths = ["tests"]
